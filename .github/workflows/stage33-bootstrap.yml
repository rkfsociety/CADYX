name: Apply roadmap stage 33

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage33-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply stage 33 refactor
        run: python scripts/stage33_bootstrap.py
      - name: Keep custom registries independent from built-in metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('cadyx/extensions.py')
          source = path.read_text(encoding='utf-8')
          old = '''        unknown_builtin_actions = set(BUILTIN_ACTIVITY_ACTIONS) - seen
        if unknown_builtin_actions:
            names_text = ", ".join(sorted(unknown_builtin_actions))
            raise ValueError(f"Built-in activity metadata has no registered command: {names_text}.")
        self._capabilities = contracts
'''
          new = '''        self._capabilities = contracts
'''
          if source.count(old) != 1:
              raise SystemExit('expected built-in metadata guard exactly once')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Compile source
        run: python -m compileall -q cadyx tests
      - name: Test command presentation registry
        run: python -m unittest discover -s tests -p 'test_command_presentation.py' -v
      - name: Test extension composition
        run: python -m unittest discover -s tests -p 'test_extensions.py' -v
      - name: Test source contracts
        run: python -m unittest discover -s tests -p 'test_source_contracts.py' -v
      - name: Verify diff
        run: git diff --check
      - name: Commit stage 33
        run: |
          rm scripts/stage33_bootstrap.py .github/workflows/stage33-bootstrap.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Centralize command activity metadata'
          git push origin HEAD:main
