name: Apply roadmap stage 34

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage34-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply stage 34 changes
        run: python scripts/apply-stage34.py
      - name: Verify source changes
        run: |
          python -m compileall -q cadyx tests
          python -m unittest tests.test_runtime_cache -v
          python -m unittest discover -s tests -p test_source_contracts.py -v
      - name: Commit implementation
        run: |
          rm .github/workflows/stage34-apply.yml scripts/apply-stage34.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete roadmap stage 34 runtime cache policy"
          git push origin HEAD:main
