name: Apply roadmap stage 35

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage35-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Decompose CadyxCore orchestration
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path

          root = Path('.')
          core_path = root / 'cadyx/core.py'
          source = core_path.read_text(encoding='utf-8')
          lines = source.splitlines(keepends=True)
          tree = ast.parse(source)
          cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'CadyxCore')
          methods = {n.name: n for n in cls.body if isinstance(n, ast.FunctionDef)}

          groups = {
              'ProjectLifecycleService': [
                  '_project_availability','_require_project_policy','_selection_project_locks',
                  '_assert_workspace_selection_policy','_project_lifecycle_lock','create_project',
                  'upload_project_step','copy_project_files','remove_staged_project_step',
                  'prune_project_files','rename_project','delete_project','list_projects',
                  'list_workspace','create_project_group','assign_project_group',
                  'workspace_selection_snapshot','select_workspace_resource','inspect_project',
              ],
              'CommandActivityService': [
                  'agent_dashboard_snapshot','report_agent_dashboard','acquire_lease','rotate_view',
                  'observe_agent_operation','heartbeat','release_lease','recover_expired_lease',
                  'stop_agent','resume_agent','execute_command',
              ],
              'RenderingCacheService': [
                  'compare_bodies','render_project','_scene_for_project','_remember_png_locked',
                  '_render_project_png_server','render_project_thumbnail_png','publish_viewport_snapshot',
                  'render_project_png_with_source','render_project_png','inspect_body_topology',
                  '_document_cache_key','_remember_geometry_validation','_invalidate_project_runtime_caches',
                  '_validate_geometry_once','_clone_scene',
              ],
              'EngineeringValidationService': [
                  'validate_body_dimensions','validate_body_clearance','list_validation_records',
                  'validate_body_preservation','validate_body_thickness','_maybe_persist_validation',
              ],
          }
          missing = sorted(x for names in groups.values() for x in names if x not in methods)
          if missing:
              raise SystemExit(f'missing core methods: {missing}')

          def start(n):
              return min([n.lineno, *[d.lineno for d in n.decorator_list]])
          def block(n):
              return ''.join(lines[start(n)-1:n.end_lineno])
          def call(n, target):
              a = n.args
              pos = [x.arg for x in (*a.posonlyargs,*a.args)]
              if pos and pos[0] in {'self','cls'}:
                  pos = pos[1:]
              out = list(pos)
              if a.vararg: out.append('*' + a.vararg.arg)
              out += [f'{x.arg}={x.arg}' for x in a.kwonlyargs]
              if a.kwarg: out.append('**' + a.kwarg.arg)
              return f"self.{target}.{n.name}({', '.join(out)})"

          targets = {
              'ProjectLifecycleService':'_lifecycle',
              'CommandActivityService':'_command_activity',
              'RenderingCacheService':'_rendering',
              'EngineeringValidationService':'_engineering_validation',
          }
          service_for = {name: svc for svc,names in groups.items() for name in names}
          repl = []
          for name, svc in service_for.items():
              n = methods[name]
              sig_end = next(i for i in range(n.lineno-1, n.body[0].lineno) if lines[i].rstrip().endswith(':'))
              header = ''.join(lines[n.lineno-1:sig_end+1])
              repl.append((start(n)-1, n.end_lineno, header + f'        return {call(n, targets[svc])}\n'))
          changed = list(lines)
          for a,b,text in sorted(repl, reverse=True):
              changed[a:b] = [text]
          core = ''.join(changed)

          import_anchor = 'from .commands import CommandSystem\n'
          service_import = '''from .core_services import (\n    CommandActivityService,\n    EngineeringValidationService,\n    ProjectLifecycleService,\n    RenderingCacheService,\n    _ProjectAvailability,\n)\n'''
          if import_anchor not in core:
              raise SystemExit('import anchor changed')
          core = core.replace(import_anchor, import_anchor + service_import, 1)

          lifecycle_state = '''        self._workspace_selection_guard = threading.RLock()\n        self._workspace_selection: dict[str, str] | None = None\n        self._project_lifecycle_guard = threading.Lock()\n        self._project_lifecycle_locks: dict[str, threading.RLock] = {}\n'''
          cache_state = '''        self._cache_policy = cache_policy if cache_policy is not None else RuntimeCachePolicy()\n        self._geometry_cache_guard = threading.RLock()\n        self._validated_document_keys: OrderedDict[tuple[str, str], None] = OrderedDict()\n        self._document_validation_locks: dict[tuple[str, str], threading.Lock] = {}\n        self._scene_cache: OrderedDict[tuple[str, str], dict[str, Any]] = OrderedDict()\n        self._png_cache: OrderedDict[tuple[str, str, int, int, int], bytes] = OrderedDict()\n        self._png_cache_bytes = 0\n        self._viewport_snapshot_guard = threading.RLock()\n        self._viewport_snapshots: OrderedDict[str, tuple[int, bytes]] = OrderedDict()\n        self._viewport_snapshot_bytes = 0\n'''
          if lifecycle_state not in core or cache_state not in core:
              raise SystemExit('state anchors changed')
          core = core.replace(lifecycle_state,'',1).replace(cache_state,'',1)
          event_anchor = '        self.events = EventBroker(dashboard_state_path=self.workspace.root / ".cadyx-agent-dashboards.json")\n'
          init = '''        self._lifecycle = ProjectLifecycleService(self)\n        self._command_activity = CommandActivityService(self)\n        self._rendering = RenderingCacheService(self, cache_policy=cache_policy)\n        self._engineering_validation = EngineeringValidationService(self)\n'''
          core = core.replace(event_anchor, event_anchor + init, 1)
          ds = core.index('@dataclass(frozen=True)\nclass _ProjectAvailability:')
          cs = core.index('\n\nclass CadyxCore:', ds)
          core = core[:ds] + core[cs+2:]
          core_path.write_text(core, encoding='utf-8')

          imports = '''"""Focused orchestration collaborators behind CadyxCore."""\nfrom __future__ import annotations\n\nimport copy\nimport math\nimport threading\nfrom collections import OrderedDict\nfrom contextlib import ExitStack, contextmanager\nfrom dataclasses import dataclass\nfrom datetime import datetime, timezone\nfrom typing import TYPE_CHECKING, Any, Callable, Iterator, Literal\nfrom uuid import uuid4\n\nfrom .delivery import geometry_sha256\nfrom .errors import CadyxError, ConflictError, NotFoundError, ValidationError\nfrom .mesh_geometry import mesh_bounds\nfrom .models import Document, OwnerType\nfrom .rendering import render_scene, render_scene_png\nfrom .runtime_cache import RuntimeCachePolicy, remember_bounded_bytes, trim_lru_entries\nfrom .workspace import utc_now\n\nif TYPE_CHECKING:\n    from .core import CadyxCore\n\n\n@dataclass(frozen=True)\nclass _ProjectAvailability:\n    lock: dict[str, Any]\n    running_operation: bool\n    active_workflow: bool\n\n    @property\n    def lock_state(self) -> str | None:\n        state = self.lock.get("state")\n        return state if isinstance(state, str) else None\n\n    @property\n    def is_free(self) -> bool:\n        return self.lock_state == "FREE" and self.lock.get("recovery_required") is False and not self.running_operation\n\n    def permits(self, policy: Literal["read","write","file_management","selection","destructive"], *, valid_lease: bool=False, sole_active_workflow_target: bool=False) -> bool:\n        if policy == "read": return True\n        if policy == "write":\n            if valid_lease:\n                return self.lock_state in {"AI_LOCKED","HUMAN_LOCKED","SYSTEM_LOCKED"} and not self.running_operation\n            return self.is_free\n        if policy in {"file_management","destructive"}: return self.is_free\n        if policy == "selection": return self.is_free and (not self.active_workflow or sole_active_workflow_target)\n        raise ValueError(f"Unknown project availability policy: {policy}")\n\n\nclass _CoreService:\n    _local_names: frozenset[str] = frozenset()\n    def __init__(self, core: CadyxCore) -> None:\n        object.__setattr__(self, "_core", core)\n    def __getattr__(self, name: str) -> Any:\n        return getattr(self._core, name)\n    def __setattr__(self, name: str, value: Any) -> None:\n        if name == "_core" or name in self._local_names:\n            object.__setattr__(self, name, value)\n        else:\n            setattr(self._core, name, value)\n\n\n'''
          preludes = {
              'ProjectLifecycleService': '''class ProjectLifecycleService(_CoreService):\n    """Own lifecycle locks, availability policy, and workspace selection."""\n    _local_names = frozenset({"_workspace_selection_guard","_workspace_selection","_project_lifecycle_guard","_project_lifecycle_locks"})\n    def __init__(self, core: CadyxCore) -> None:\n        super().__init__(core)\n        self._workspace_selection_guard = threading.RLock()\n        self._workspace_selection: dict[str,str] | None = None\n        self._project_lifecycle_guard = threading.Lock()\n        self._project_lifecycle_locks: dict[str,threading.RLock] = {}\n\n''',
              'CommandActivityService': 'class CommandActivityService(_CoreService):\n    """Coordinate leases, commands, dashboards, and activity."""\n\n',
              'RenderingCacheService': '''class RenderingCacheService(_CoreService):\n    """Own revision-bound rendering caches and viewport snapshots."""\n    _local_names = frozenset({"_cache_policy","_geometry_cache_guard","_validated_document_keys","_document_validation_locks","_scene_cache","_png_cache","_png_cache_bytes","_viewport_snapshot_guard","_viewport_snapshots","_viewport_snapshot_bytes"})\n    def __init__(self, core: CadyxCore, *, cache_policy: RuntimeCachePolicy | None=None) -> None:\n        super().__init__(core)\n        self._cache_policy = cache_policy if cache_policy is not None else RuntimeCachePolicy()\n        self._geometry_cache_guard = threading.RLock()\n        self._validated_document_keys: OrderedDict[tuple[str,str],None] = OrderedDict()\n        self._document_validation_locks: dict[tuple[str,str],threading.Lock] = {}\n        self._scene_cache: OrderedDict[tuple[str,str],dict[str,Any]] = OrderedDict()\n        self._png_cache: OrderedDict[tuple[str,str,int,int,int],bytes] = OrderedDict()\n        self._png_cache_bytes = 0\n        self._viewport_snapshot_guard = threading.RLock()\n        self._viewport_snapshots: OrderedDict[str,tuple[int,bytes]] = OrderedDict()\n        self._viewport_snapshot_bytes = 0\n\n''',
              'EngineeringValidationService': 'class EngineeringValidationService(_CoreService):\n    """Run revision-bound engineering validation and persistence."""\n\n',
          }
          out = [imports]
          for svc,names in groups.items():
              out.append(preludes[svc])
              for name in names:
                  out += [block(methods[name]), '\n']
          (root/'cadyx/core_services.py').write_text(''.join(out), encoding='utf-8')

          (root/'tests/test_core_services.py').write_text('''"""Direct tests for CadyxCore collaborators."""\nfrom __future__ import annotations\nimport tempfile\nimport unittest\nfrom cadyx.core import CadyxCore\nfrom cadyx.core_services import CommandActivityService, EngineeringValidationService, ProjectLifecycleService, RenderingCacheService\nfrom cadyx.runtime_cache import RuntimeCachePolicy\n\nclass CoreServiceCompositionTests(unittest.TestCase):\n    def test_core_composes_services(self) -> None:\n        with tempfile.TemporaryDirectory() as root:\n            core = CadyxCore(root, kernel=object())\n            self.assertIsInstance(core._lifecycle, ProjectLifecycleService)\n            self.assertIsInstance(core._command_activity, CommandActivityService)\n            self.assertIsInstance(core._rendering, RenderingCacheService)\n            self.assertIsInstance(core._engineering_validation, EngineeringValidationService)\n    def test_lifecycle_state_is_owned_by_service(self) -> None:\n        with tempfile.TemporaryDirectory() as root:\n            core = CadyxCore(root, kernel=object())\n            created = core.create_project("service-owned-lifecycle")\n            pid = created["project"]["id"]\n            self.assertEqual(core.workspace_selection_snapshot(), {"type":"project","project_id":pid})\n            self.assertNotIn("_workspace_selection", core.__dict__)\n            self.assertIn("_workspace_selection", core._lifecycle.__dict__)\n    def test_render_cache_state_is_owned_by_service(self) -> None:\n        policy = RuntimeCachePolicy(validated_document_entries=2, scene_entries=3, png_entries=4, png_bytes=1024, viewport_snapshot_entries=5, viewport_snapshot_bytes=2048)\n        with tempfile.TemporaryDirectory() as root:\n            core = CadyxCore(root, kernel=object(), cache_policy=policy)\n            self.assertIs(core._rendering._cache_policy, policy)\n            self.assertNotIn("_scene_cache", core.__dict__)\n            core._invalidate_project_runtime_caches("missing")\n\nif __name__ == "__main__": unittest.main()\n''', encoding='utf-8')

          roadmap_path = root/'.codex/roadmap.md'
          roadmap = roadmap_path.read_text(encoding='utf-8')
          old = '35. **Candidate — CadyxCore orchestration decomposition:** after the workspace/event/runtime contracts above are stabilized, split the oversized `CadyxCore` implementation behind its existing public facade into focused collaborators for project lifecycle/selection, command execution/activity, rendering/cache ownership and engineering validation. Keep `CadyxCore` as the API-facing composition root so Agent API/MCP/HTTP callers and lease semantics stay unchanged. Acceptance: each collaborator has a narrow dependency surface and direct unit tests, no collaborator bypasses Core\'s lease/revision/atomic-save rules, cross-project lock ordering remains explicit, and the existing Core/Web/MCP suites remain behaviorally identical. Evidence: [`cadyx/core.py`](../cadyx/core.py), [`tests/test_locking.py`](../tests/test_locking.py), [`tests/test_agent_control.py`](../tests/test_agent_control.py), [`tests/test_web_api.py`](../tests/test_web_api.py), and [`tests/test_mcp_server.py`](../tests/test_mcp_server.py).'
          new = '35. **Complete — CadyxCore orchestration decomposition:** `CadyxCore` remains the API-facing composition root while four focused collaborators own project lifecycle/selection state, command execution/activity orchestration, revision-bound rendering/cache state, and engineering validation. Public Core method names and signatures remain unchanged and delegate behind the facade; lifecycle lock ordering, lease/revision checks and atomic workspace saves still flow through the same Core/Workspace boundaries. Runtime cache budgets/invalidation are owned by the rendering collaborator, while workspace selection and lifecycle locks are owned by the lifecycle collaborator. Evidence: [`cadyx/core.py`](../cadyx/core.py), [`cadyx/core_services.py`](../cadyx/core_services.py), [`tests/test_core_services.py`](../tests/test_core_services.py), [`tests/test_locking.py`](../tests/test_locking.py), [`tests/test_agent_control.py`](../tests/test_agent_control.py), [`tests/test_web_api.py`](../tests/test_web_api.py), and [`tests/test_mcp_server.py`](../tests/test_mcp_server.py).'
          if old not in roadmap: raise SystemExit('roadmap stage 35 anchor changed')
          roadmap_path.write_text(roadmap.replace(old,new,1), encoding='utf-8')
          PY
      - name: Install quality tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and type ratchet
        shell: bash
        run: |
          python -m ruff check --fix cadyx/core.py cadyx/core_services.py tests/test_core_services.py
          python -m ruff check .
          python - <<'PY'
          import json,re,subprocess,sys,tomllib
          from collections import Counter
          from pathlib import Path
          cfg=tomllib.loads(Path('pyproject.toml').read_text())
          files=list(cfg['tool']['cadyx']['static-quality']['mypy-ratchet-files'])
          p=subprocess.run([sys.executable,'-m','mypy',*files,'--no-error-summary','--no-pretty'],text=True,capture_output=True)
          if p.returncode not in (0,1): raise SystemExit(p.returncode)
          pat=re.compile(r'^(.+?\.py):\d+(?::\d+)?: error: .+? \[([^\]]+)\]$')
          actual={}
          for line in (p.stdout+p.stderr).splitlines():
              if ': error:' not in line: continue
              m=pat.match(line)
              if not m: raise SystemExit(f'unparsed mypy error: {line}')
              mod=Path(m.group(1).replace('\\','/')).stem
              actual.setdefault(mod,Counter())[m.group(2)]+=1
          for f in files: actual.setdefault(Path(f).stem,Counter())
          bp=Path('tests/mypy-error-baseline.json'); old=json.loads(bp.read_text())
          for mod,codes in actual.items():
              for code,count in codes.items():
                  if count>old.get(mod,{}).get(code,0): raise SystemExit(f'mypy debt increased: {mod}[{code}]')
          bp.write_text(json.dumps({m:{c:n for c,n in sorted(v.items()) if n} for m,v in sorted(actual.items())},indent=2)+'\n')
          PY
          python scripts/check-static-types.py
      - name: Verify focused behavior
        shell: bash
        run: |
          python -m compileall -q cadyx tests scripts
          python -m unittest discover -s tests -p 'test_core_services.py' -v
          python -m unittest discover -s tests -p 'test_source_contracts.py' -v
          python -m unittest discover -s tests -p 'test_locking.py' -v
          python -m unittest discover -s tests -p 'test_agent_control.py' -v
          python -m unittest discover -s tests -p 'test_static_quality.py' -v
          git diff --check
      - name: Commit stage 35
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cadyx/core.py cadyx/core_services.py tests/test_core_services.py tests/mypy-error-baseline.json .codex/roadmap.md
          git commit -m 'Complete roadmap stage 35 core orchestration decomposition'
          git push origin main
